name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/praxis
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/praxis_test
      DATABASE_URL_E2E: postgres://postgres:postgres@localhost:5432/praxis_e2e
      AUTH_SECRET: ci-only-secret-value-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create databases
        run: |
          for db in praxis praxis_test praxis_e2e; do
            PGPASSWORD=postgres psql -h localhost -U postgres -c "create database $db"
          done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
